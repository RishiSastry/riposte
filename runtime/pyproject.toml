[project]
name = "riposte-rt"
version = "0.1.0"
description = "Riposte runtime: interprets the JSON policy IR and plays battles via poke-env."
requires-python = ">=3.11"
dependencies = [
    "poke-env>=0.10",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riposte_rt"]

[tool.ruff]
line-length = 100
target-version = "py311"
