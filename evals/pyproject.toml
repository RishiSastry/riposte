[project]
name = "riposte-evals"
version = "0.1.0"
description = "Riposte-specific eval bindings: Gherkin step definitions + baselines that plug into evalkit. Depends on evalkit and runs it on build (CI)."
requires-python = ">=3.11"
dependencies = [
    "evalkit",
    "riposte-rt",
    "poke-env>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riposte_evals"]
