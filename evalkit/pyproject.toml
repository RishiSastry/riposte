[project]
name = "evalkit"
version = "0.1.0"
description = "Generic agent-steering eval framework: run Gherkin .feature evals against a deep agent + MCP server. Domain-agnostic (no Riposte imports)."
requires-python = ">=3.11"
dependencies = [
    "gherkin-official>=42",
]

[project.optional-dependencies]
# The deep-agent driver's heavy deps are optional so the core engine (parser, runner,
# registry, stub driver, CLI) installs and tests without LangChain/LLM stacks.
agent = [
    "deepagents>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langchain-anthropic>=0.3",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]
