[project]
name = "riposte-mcp"
version = "0.1.0"
description = "Progressive language-discovery MCP server for Riposte (SPEC §8)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
]

[project.scripts]
riposte-mcp = "riposte_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riposte_mcp"]
